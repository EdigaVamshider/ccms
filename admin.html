<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - CCMS</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">CCMS Admin</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard Overview</a>
        <a href="admin.html" class="nav-item active">Manage Complaints</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="nav-item text-muted">Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <header class="page-header animate-fade-in">
        <div>
          <h1 class="page-title">Complaint Management</h1>
          <p style="color: var(--text-muted); margin-top: 0.25rem;">Review and resolve campus issues.</p>
        </div>
        <div class="user-profile">
          <span style="font-size: 1.25rem;">🛡️</span>
          <span id="welcomeText">Admin</span>
        </div>
      </header>

      <section class="glass-card animate-fade-in" style="animation-delay: 0.1s;">
        <div class="flex justify-between align-center mb-2">
          <h2 class="card-title" style="margin:0;">All Submissions</h2>
          <button id="refreshBtn" class="btn btn-sm btn-outline">Refresh Data</button>
        </div>

        <div class="table-container" style="border: none;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminComplaintsTableBody">
              <tr><td colspan="7" class="text-center" style="padding: 2rem;">Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Resolution Modal (Apple Style Slide up) -->
  <div id="resolutionModal" class="modal-overlay">
    <div class="modal">
      <h3 class="card-title" style="text-align: center; margin-bottom: 2rem;">Update Status</h3>
      
      <form id="resolutionForm">
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">
          Updating Complaint <strong id="modalComplaintId" style="color: var(--text-main);"></strong>
        </p>
        
        <div class="form-group">
          <select id="statusSelect" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <label for="statusSelect">New Status</label>
        </div>
        
        <div class="form-group">
          <textarea id="actionTaken" rows="3" placeholder=" "></textarea>
          <label for="actionTaken">Action Taken / Remarks</label>
        </div>
        
        <div class="flex gap-2" style="margin-top: 2rem;">
          <button type="button" class="btn btn-outline flex-1" id="closeModalBtn" style="flex:1;">Cancel</button>
          <button type="submit" class="btn btn-primary flex-1" id="saveUpdateBtn" style="flex:1;">
            <span class="flex justify-center gap-2">Save <div id="adminModalSpinner" class="spinner hidden" style="width: 1rem; height: 1rem; border-width: 2px;"></div></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
